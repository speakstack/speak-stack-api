<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Check Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; color: #1a1a1a; }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .subtitle { color: #666; margin-bottom: 24px; }
    .section { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; border: 1px solid #e0e0e0; }
    label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 14px; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; }
    input:focus, textarea:focus { outline: none; border-color: #007aff; }
    textarea { min-height: 120px; resize: vertical; }
    .row { display: flex; gap: 12px; margin-bottom: 12px; }
    .row > div { flex: 1; }
    button { background: #007aff; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
    button:hover { background: #0063d1; }
    button:disabled { background: #999; cursor: not-allowed; }
    .error-msg { background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 12px; color: #dc2626; margin-bottom: 16px; }
    #loading { display: none; color: #666; }
    #results { display: none; }

    /* Highlighted text area */
    .highlighted-text { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin-bottom: 16px; font-size: 15px; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; }

    /* Inline error highlights */
    .err-mark { position: relative; cursor: pointer; border-radius: 3px; padding: 1px 2px; transition: background 0.15s; }
    .err-mark.grammar    { background: #fee2e2; border-bottom: 2px solid #ef4444; }
    .err-mark.spelling   { background: #ffedd5; border-bottom: 2px solid #f97316; }
    .err-mark.punctuation { background: #dbeafe; border-bottom: 2px solid #3b82f6; }
    .err-mark.style      { background: #ede9fe; border-bottom: 2px solid #8b5cf6; }
    .err-mark.word_choice { background: #d1fae5; border-bottom: 2px solid #10b981; }

    .err-mark:hover { filter: brightness(0.92); }
    .err-mark.active { outline: 2px solid #007aff; outline-offset: 1px; }

    /* Tooltip */
    .tooltip { display: none; position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; border-radius: 8px; padding: 10px 14px; font-size: 13px; line-height: 1.5; width: max-content; max-width: 320px; z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,0.2); pointer-events: none; }
    .tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #1a1a1a; }
    .err-mark:hover .tooltip, .err-mark.active .tooltip { display: block; }
    .tooltip .t-badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .tooltip .t-badge.grammar { background: #ef4444; }
    .tooltip .t-badge.spelling { background: #f97316; }
    .tooltip .t-badge.punctuation { background: #3b82f6; }
    .tooltip .t-badge.style { background: #8b5cf6; }
    .tooltip .t-badge.word_choice { background: #10b981; }
    .tooltip .t-fix { margin: 6px 0 4px; }
    .tooltip .t-original { text-decoration: line-through; opacity: 0.7; }
    .tooltip .t-arrow { margin: 0 4px; opacity: 0.5; }
    .tooltip .t-corrected { color: #4ade80; font-weight: 600; }
    .tooltip .t-explanation { opacity: 0.8; font-size: 12px; }

    /* Stats bar */
    .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .stats-bar .count { font-weight: 700; font-size: 16px; }
    .stats-bar .meta { color: #666; font-size: 13px; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .legend-item { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #666; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: background 0.15s; }
    .legend-item:hover { background: #f0f0f0; }
    .legend-item.dimmed { opacity: 0.35; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .legend-dot.grammar { background: #ef4444; }
    .legend-dot.spelling { background: #f97316; }
    .legend-dot.punctuation { background: #3b82f6; }
    .legend-dot.style { background: #8b5cf6; }
    .legend-dot.word_choice { background: #10b981; }

    /* Corrected text */
    .corrected-section { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 14px 16px; }
    .corrected-section label { color: #166534; margin-bottom: 4px; }
    .corrected-section p { font-size: 15px; line-height: 1.6; }
    .copy-btn { background: none; border: 1px solid #bbf7d0; color: #166534; padding: 4px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .copy-btn:hover { background: #dcfce7; }

    /* No issues */
    .no-issues { text-align: center; padding: 24px; color: #166534; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Grammar Checker</h1>
  <p class="subtitle">Test the grammar check API</p>

  <div class="section">
    <div class="row">
      <div>
        <label>API URL</label>
        <input id="apiUrl" value="http://localhost:8080/api" />
      </div>
      <div>
        <label>JWT Token</label>
        <input id="token" placeholder="Paste your access token" />
      </div>
    </div>
    <button id="loginBtn" onclick="login()">Or Sign In</button>
    <div id="loginForm" style="display:none; margin-top:12px;">
      <div class="row">
        <div><input id="email" placeholder="Email" /></div>
        <div><input id="password" type="password" placeholder="Password" /></div>
      </div>
      <button onclick="doLogin()">Sign In</button>
    </div>
  </div>

  <div class="section">
    <label>Text to check</label>
    <textarea id="text" placeholder="i want learn english grammer because it is very very important for my career."></textarea>
    <div style="margin-top:12px; display:flex; align-items:center; gap:12px;">
      <button id="checkBtn" onclick="checkGrammar()">Check Grammar</button>
      <span id="loading">Checking...</span>
    </div>
  </div>

  <div id="error"></div>

  <div id="results">
    <div class="stats-bar">
      <span class="count" id="issueCount"></span>
      <span class="meta" id="detectedLang"></span>
    </div>

    <div class="legend" id="legend"></div>

    <div class="highlighted-text" id="highlightedText"></div>

    <div class="corrected-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <label style="margin:0;">Corrected Text</label>
        <button class="copy-btn" onclick="copyText()">Copy</button>
      </div>
      <p id="correctedText"></p>
    </div>
  </div>

  <script>
    let lastData = null;
    let hiddenTypes = new Set();

    function login() {
      const el = document.getElementById('loginForm');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    async function doLogin() {
      const base = document.getElementById('apiUrl').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const res = await fetch(`${base}/auth/sign-in`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const json = await res.json();
        if (json.data?.accessToken) {
          document.getElementById('token').value = json.data.accessToken;
          document.getElementById('loginForm').style.display = 'none';
        } else {
          alert('Login failed: ' + JSON.stringify(json));
        }
      } catch (e) {
        alert('Login error: ' + e.message);
      }
    }

    async function checkGrammar() {
      const base = document.getElementById('apiUrl').value;
      const token = document.getElementById('token').value;
      const text = document.getElementById('text').value;

      if (!token) return alert('Token required');
      if (!text) return alert('Text required');

      document.getElementById('results').style.display = 'none';
      document.getElementById('error').innerHTML = '';
      document.getElementById('loading').style.display = 'inline';
      document.getElementById('checkBtn').disabled = true;

      try {
        const res = await fetch(`${base}/grammar/check`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify({ text }),
        });

        const json = await res.json();

        if (!res.ok) {
          document.getElementById('error').innerHTML =
            `<div class="error-msg"><strong>${res.status}</strong> ${json.message || JSON.stringify(json)}</div>`;
          return;
        }

        lastData = json.data;
        hiddenTypes.clear();
        renderResults(text);
      } catch (e) {
        document.getElementById('error').innerHTML =
          `<div class="error-msg">${esc(e.message)}</div>`;
      } finally {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('checkBtn').disabled = false;
      }
    }

    function renderResults(originalText) {
      const data = lastData;
      if (!data) return;

      // Stats
      const visibleCorrections = data.corrections.filter(c => !hiddenTypes.has(c.type));
      document.getElementById('issueCount').textContent =
        `${visibleCorrections.length} issue${visibleCorrections.length !== 1 ? 's' : ''} found`;
      document.getElementById('detectedLang').textContent = `Language: ${data.language}`;

      // Legend - filter toggles
      const types = [...new Set(data.corrections.map(c => c.type))];
      const legendEl = document.getElementById('legend');
      legendEl.innerHTML = '';
      types.forEach(type => {
        const count = data.corrections.filter(c => c.type === type).length;
        const item = document.createElement('span');
        item.className = `legend-item${hiddenTypes.has(type) ? ' dimmed' : ''}`;
        item.innerHTML = `<span class="legend-dot ${type}"></span>${type} (${count})`;
        item.onclick = () => {
          if (hiddenTypes.has(type)) hiddenTypes.delete(type);
          else hiddenTypes.add(type);
          renderResults(originalText);
        };
        legendEl.appendChild(item);
      });

      // Build highlighted text
      // Sort corrections by offset, filter valid ones
      const corrections = data.corrections
        .filter(c => !hiddenTypes.has(c.type))
        .map(c => ({
          ...c,
          // Verify offset: if substring matches original, use it; else try string search
          verifiedOffset: verifyOffset(originalText, c),
        }))
        .filter(c => c.verifiedOffset !== -1)
        .sort((a, b) => a.verifiedOffset - b.verifiedOffset);

      // Dedupe overlapping ranges
      const merged = [];
      for (const c of corrections) {
        const start = c.verifiedOffset;
        const end = start + c.original.length;
        const prev = merged[merged.length - 1];
        if (prev && start < prev.verifiedOffset + prev.original.length) continue; // skip overlap
        merged.push(c);
      }

      let html = '';
      let cursor = 0;
      for (const c of merged) {
        const start = c.verifiedOffset;
        const end = start + c.original.length;
        // Text before this error
        if (start > cursor) {
          html += esc(originalText.slice(cursor, start));
        }
        // Error span with tooltip
        html += `<span class="err-mark ${c.type}" data-idx="${merged.indexOf(c)}" onclick="toggleMark(this)">`;
        html += esc(originalText.slice(start, end));
        html += `<span class="tooltip">`;
        html += `<span class="t-badge ${c.type}">${c.type}</span>`;
        html += `<div class="t-fix"><span class="t-original">${esc(c.original)}</span><span class="t-arrow"> &rarr; </span><span class="t-corrected">${esc(c.corrected)}</span></div>`;
        html += `<div class="t-explanation">${esc(c.explanation)}</div>`;
        html += `</span></span>`;
        cursor = end;
      }
      // Remaining text
      if (cursor < originalText.length) {
        html += esc(originalText.slice(cursor));
      }

      const container = document.getElementById('highlightedText');
      container.innerHTML = html;

      // No issues message
      if (data.totalIssues === 0) {
        container.innerHTML = '<div class="no-issues">No issues found!</div>';
      }

      // Corrected text
      document.getElementById('correctedText').textContent = data.correctedText;
      document.getElementById('results').style.display = 'block';
    }

    function verifyOffset(text, correction) {
      const { offset, length } = correction.position;
      // First: trust the offset if it matches
      if (text.substring(offset, offset + length) === correction.original) {
        return offset;
      }
      // Fallback: find by string search
      const idx = text.indexOf(correction.original);
      return idx;
    }

    function toggleMark(el) {
      const wasActive = el.classList.contains('active');
      document.querySelectorAll('.err-mark.active').forEach(e => e.classList.remove('active'));
      if (!wasActive) el.classList.add('active');
    }

    // Close active tooltip on outside click
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.err-mark')) {
        document.querySelectorAll('.err-mark.active').forEach(el => el.classList.remove('active'));
      }
    });

    function copyText() {
      if (lastData) {
        navigator.clipboard.writeText(lastData.correctedText);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      }
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
